spring:
  application:
    name: esam-backend

  jpa:
    # hibernate:
    #   ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/esam_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}


  flyway:
    enabled: true
    locations: classpath:db/migration

  # Permite que mvn test / mvn spring-boot:run lean el .env tambien.
  # Con "optional:" la ausencia del archivo no rompe el arranque.
  config:
    import: "optional:file:.env[.properties]"

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

cloudinary:
  url: ${CLOUDINARY_URL}
