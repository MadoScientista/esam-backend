spring:
  application:
    name: esam-backend

  jpa:
    # hibernate:
    #   ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect


  datasource:
    url: jdbc:mysql://localhost:3306/esam_db?createDatabaseIfNotExist=true
    username: admin_esam_db
    password: 1234


  flyway:
    enabled: true
    locations: classpath:db/migration



server:
  port: 8087